[package]
name = "codexbar-windows"
version = "0.10.0"
edition = "2021"
description = "AI coding-provider usage limits in the Windows system tray — a Windows version of CodexBar."
license = "MIT"
repository = "https://github.com/SeanShaffer88/CodexBar-Windows"

[[bin]]
name = "codexbar-windows"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Networking_WinHttp",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
